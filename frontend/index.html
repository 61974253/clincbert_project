</head>

<body>

<div class="container">

```
<h1>Clinical Report Analysis</h1>

<p>
    Upload a patient medical report PDF or image.
    PaddleOCR is the default OCR engine, with Tesseract available as a fallback when installed.
</p>

<div class="upload-box">
    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.bmp,.tiff,.tif">
    <p id="fileName">No file selected</p>
</div>

<div class="controls">
    <label for="engineSelect">OCR engine:</label>
    <select id="engineSelect">
        <option value="paddleocr">PaddleOCR</option>
        <option value="tesseract">Tesseract</option>
    </select>
    <button id="analyzeBtn" onclick="analyzeReport()">
        Analyze Patient Report
    </button>
</div>

<div id="result"></div>
```

</div>

<script>

const API_URL = "http://127.0.0.1:8000";

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderResult(data) {
    const extractedText = data.extracted_text || "No text extracted.";
    const entities = data.clinicalbert && data.clinicalbert.entities ? data.clinicalbert.entities : [];
    const tableRows = Array.isArray(data.table_rows) ? data.table_rows : [];

    const entitiesHtml = entities.length
        ? `<div class="entity-list">${entities.map(entity => `<span class="entity-item">${escapeHtml(entity.text)} (${escapeHtml(entity.type)})</span>`).join("")}</div>`
        : `<p>No medical entities found.</p>`;

    const tableHtml = tableRows.length
        ? `<ul class="table-list">${tableRows.map(row => `<li>${escapeHtml(row)}</li>`).join("")}</ul>`
        : `<p>No table-like rows detected.</p>`;

    document.getElementById("result").innerHTML = `
        <div class="meta">
            <span class="badge">OCR: ${escapeHtml(data.ocr_engine || "unknown")}</span>
            <span class="badge">Accuracy: ${escapeHtml(data.overall_accuracy ?? 0)}%</span>
            <span class="badge">Time: ${escapeHtml(data.execution_time ?? 0)}s</span>
        </div>

        <div class="panel">
            <h3>Extracted Text</h3>
            <pre>${escapeHtml(extractedText)}</pre>
        </div>

        <div class="panel">
            <h3>ClinicalBERT Entities</h3>
            ${entitiesHtml}
        </div>

        <div class="panel">
            <h3>Table Rows</h3>
            ${tableHtml}
        </div>
    `;
}

document.getElementById("fileInput").addEventListener("change", function () {

    const file = this.files[0];

    if (file) {
        document.getElementById("fileName").textContent = file.name;
    }

});

async function analyzeReport() {

    const fileInput = document.getElementById("fileInput");
    const result = document.getElementById("result");
    const button = document.getElementById("analyzeBtn");
    const engineSelect = document.getElementById("engineSelect");

    if (!fileInput.files.length) {
        result.innerHTML = "<p class='error'>Please select a PDF or image.</p>";
        return;
    }

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append("file", file);
    formData.append("ocr_engine", engineSelect.value);

    button.disabled = true;
    button.textContent = "Analyzing...";

    result.innerHTML = "<p>Processing patient report...</p>";

    try {

        const response = await fetch(
            `${API_URL}/api/analyze`,
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Backend error");
        }

        renderResult(data);

    } catch (error) {

        result.innerHTML =
            "<p class='error'>❌ Error: " +
            escapeHtml(error.message) +
            "</p>";

    } finally {

        button.disabled = false;
        button.textContent = "Analyze Patient Report";

    }
}

</script>

</body>
</html>
